<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoCash Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .payment-box {
            width: 92%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d9dfe7;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #6335e8;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #6335e8;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        button:disabled {
            background: #999;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            line-height: 1.5;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #d93025;
        }

        .info {
            color: #555;
        }
    </style>
</head>

<body>

<div class="payment-box">

    <h1>Make Payment</h1>

    <div class="subtitle">
        Pay securely with EcoCash
    </div>

    <label for="amount">
        Amount (USD)
    </label>

    <input
        id="amount"
        type="number"
        placeholder="Enter amount"
        min="0.01"
        step="0.01"
    >

    <label for="phone">
        EcoCash Number
    </label>

    <input
        id="phone"
        type="tel"
        placeholder="0771234567"
    >

    <button id="payButton" onclick="startPayment()">
        Pay Now
    </button>

    <div id="message"></div>

</div>


<script>

const BACKEND_URL =
    "https://kinton11.onrender.com/create-payment";
    
async function startPayment() {

    const amount =
        document.getElementById("amount").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("payButton");


    // Check amount
    if (!amount || Number(amount) <= 0) {

        message.className = "error";
        message.innerText =
            "Please enter a valid amount.";

        return;
    }


    // Check phone
    if (!phone) {

        message.className = "error";
        message.innerText =
            "Please enter your EcoCash number.";

        return;
    }


    button.disabled = true;
    button.innerText = "Starting payment...";

    message.className = "info";
    message.innerText =
        "Connecting to EcoCash...";


    try {

        const response = await fetch(
            BACKEND_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    amount: Number(amount),

                    phone: phone

                })
            }
        );


        const data =
            await response.json();


        let errorMessage = "Payment could not be started.";

if (data.error) {
    errorMessage =
        typeof data.error === "string"
            ? data.error
            : JSON.stringify(data.error);
}

if (data.message) {
    errorMessage = data.message;
}

if (data.details) {
    errorMessage +=
        "\n" + JSON.stringify(data.details);
}

throw new Error(errorMessage);
        }


        console.log(
            "Payment response:",
            data
        );


        if (
            data.status ===
            "requires_authorization"
        ) {

            message.className = "success";

            message.innerText =
                "Payment request sent! Check your EcoCash phone and follow the prompt.";

        }

        else if (
            data.status === "pending"
        ) {

            message.className = "info";

            message.innerText =
                "Payment is processing. Please wait...";

        }

        else if (
            data.status === "succeeded"
        ) {

            message.className = "success";

            message.innerText =
                "Payment successful!";

        }

        else {

            message.className = "info";

            message.innerText =
                "Payment status: " +
                (data.status || "processing");

        }


    } catch (error) {

        console.error(error);

        message.className = "error";

        message.innerText =
            error.message ||
            "Unable to start payment.";

    }


    button.disabled = false;
    button.innerText = "Pay Now";

}

</script>

</body>
  </html>
